name: rental-service

services:
  postgres:
    image: postgres:15-alpine
    container_name: rental-postgres
    environment:
      POSTGRES_DB: springdb
      POSTGRES_USER: springuser
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - rental_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springuser -d springdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rental_postgres_data: